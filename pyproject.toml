[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kittiwake-risk-lab"
version = "1.0.0"
description = "Reproducible stochastic population dynamics and quasi-extinction risk analysis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3", "pandas>=2.2,<3", "scipy>=1.15,<2",
  "matplotlib>=3.10,<4", "openpyxl>=3.1,<4", "streamlit>=1.51,<2",
  "altair>=5.5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.16,<0.17"]

[project.scripts]
kittiwake-risk = "population_risk.__main__:main"

[tool.setuptools.packages.find]
include = ["population_risk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

